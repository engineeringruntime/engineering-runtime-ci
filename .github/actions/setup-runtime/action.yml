name: Setup Engineering Runtime
description: >
  Install a public Engineering Runtime binary release, put it on PATH, bootstrap a
  throwaway Runtime Home, and export the GitHub organization for steps that
  need one.

  It used to write a context.yaml holding that organization. Runtime retired
  its own context document — a Home holding one now blocks every command —
  and org-scoped operations take the organization as an argument, so the
  value is exported as RUNTIME_GITHUB_ORG for the job to pass explicitly.

inputs:
  github_organization:
    description: >
      GitHub organization for org-scoped operations. Exported as
      RUNTIME_GITHUB_ORG and echoed as the `organization` output; steps pass
      it explicitly, e.g. `--input organization=$RUNTIME_GITHUB_ORG`.
    required: false
    default: ""
  runtime_github_token:
    description: >
      Deprecated compatibility input. Public runtime installation requires no
      credential; pass RUNTIME_GITHUB_TOKEN only to later provider operations.
    required: false
    default: ""
  version:
    description: >
      Release tag to install (e.g. v0.6.0). Empty = latest public release.
    required: false
    default: ""

outputs:
  organization:
    description: The GitHub organization callers should pass to org-scoped operations.
    value: ${{ inputs.github_organization }}

runs:
  using: composite
  steps:
    - name: Install Engineering Runtime
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/engineering-runtime/bin
      run: |
        set -euo pipefail
        curl -fsSL \
          https://raw.githubusercontent.com/engineeringruntime/engineering-runtime-releases/main/install.sh \
          | sh
        echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"

    - name: Verify install
      shell: bash
      run: runtime version

    - name: Bootstrap Runtime Home
      shell: bash
      env:
        # Keep the implicit, non-authoritative capability cache inside this
        # disposable Home even if the caller has a job-level compatibility
        # override. Bootstrap creates the cache directory but seeds no files.
        RUNTIME_CAPABILITIES_DIR: ""
      run: runtime bootstrap

    - name: Verify fresh Runtime Home ownership
      shell: bash
      run: |
        set -euo pipefail
        for path in config.yaml policy-config.yaml context.yaml; do
          if [ -e "${ENGINEERING_RUNTIME_HOME}/${path}" ]; then
            echo "::error::runtime bootstrap created user-owned ${ENGINEERING_RUNTIME_HOME}/${path}" >&2
            exit 1
          fi
        done
        test -d "${ENGINEERING_RUNTIME_HOME}/capabilities"
        if find "${ENGINEERING_RUNTIME_HOME}/capabilities" -mindepth 1 -print -quit | grep -q .; then
          echo "::error::runtime bootstrap populated the non-authoritative capability cache" >&2
          exit 1
        fi
        runtime config validate

    - name: Export the GitHub organization
      if: inputs.github_organization != ''
      shell: bash
      env:
        ORG: ${{ inputs.github_organization }}
      run: |
        set -euo pipefail
        # Exported, not written into the Runtime Home. Runtime keeps no context
        # document, and a Home holding one blocks every command — so a step that
        # needs an organization passes it on the command line, where the audit
        # record shows which one was used.
        echo "RUNTIME_GITHUB_ORG=${ORG}" >> "$GITHUB_ENV"

    - name: Report the effective context
      shell: bash
      run: runtime context show
