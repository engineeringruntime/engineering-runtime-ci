name: GitHub — security posture

# Open Dependabot + code-scanning + secret-scanning alerts for a repo.
# Read-only; requires a token with security_events (and related) read.
#
# All three endpoints 403 when the feature is switched off for the repository
# ("Dependabot alerts are disabled for this repository"), and a capability has
# no conditional steps — one disabled feature fails the whole workflow. The
# preflight below probes the cheapest endpoint and skips with a notice when the
# features are not enabled, so a scheduled run does not go red over a repo
# setting.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository as owner/repo
        required: true
        default: ""

permissions:
  contents: read
  security-events: read

env:
  RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  # Governance comes from the two documents at the root of this repository, not
  # from the binary's compiled defaults. They are the template a reader copies,
  # and CI proves them on the same commit.
  RUNTIME_CONFIG_FILE: ${{ github.workspace }}/config.yaml
  RUNTIME_POLICY_FILE: ${{ github.workspace }}/policy.yaml
  RUNTIME_CONSUMER: ci
  RUNTIME_ACTOR_NAME: "github-actions/${{ github.workflow }}"
  RUNTIME_SESSION_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
  RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}

jobs:
  security-posture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime

      - name: Setup public capability store
        id: capabilities
        uses: ./.github/actions/setup-capabilities

      - name: Check whether security features are enabled
        id: preflight
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          set -euo pipefail
          runtime auth login github

          # Cheapest probe of the same endpoint step 1 uses. A 403 here means
          # the feature is off for this repo, not that the token is wrong.
          if runtime github api GET "/repos/${REPOSITORY}/dependabot/alerts" per_page=1 >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "security features reachable on ${REPOSITORY}"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::Dependabot/code-scanning/secret-scanning alerts are not enabled (or not readable) on ${REPOSITORY}, so there is no security posture to report. Enable them in repository settings, or dispatch this workflow against a repo that has them on."
          fi

          runtime auth logout github

      - name: Execute github-security-posture
        if: steps.preflight.outputs.enabled == 'true'
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          CAPABILITY_PATH: ${{ steps.capabilities.outputs.directory }}/github/github-security-posture.md
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          set -euo pipefail
          runtime auth login github
          runtime capability validate "${CAPABILITY_PATH}"
          runtime --output json capability execute "${CAPABILITY_PATH}" \
            --input "repository=${REPOSITORY}"
          runtime auth logout github
          runtime audit tail -n 20
