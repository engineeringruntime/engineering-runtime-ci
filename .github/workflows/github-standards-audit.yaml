name: GitHub — repo standards audit

# Summary + community profile + topics + languages for a repository.

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      repository:
        description: Repository as owner/repo
        required: true
        default: ""

permissions:
  contents: read

env:
  ENGINEERING_RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  RUNTIME_CONFIG_FILE: ${{ github.workspace }}/runtime-home/config.yaml
  RUNTIME_POLICY_FILE: ${{ github.workspace }}/runtime-home/policy-config.yaml
  ENGINEERING_RUNTIME_CONSUMER: ci

jobs:
  standards-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime
        with:
          github_organization: ${{ vars.GITHUB_ORG || github.repository_owner }}

      - name: Execute github-repo-standards-audit
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          set -euo pipefail
          runtime auth login github
          runtime capability validate examples/capabilities/github/github-repo-standards-audit.md
          runtime --output json capability execute examples/capabilities/github/github-repo-standards-audit.md \
            --input "repository=${REPOSITORY}"
          runtime auth logout github
          runtime audit tail -n 20
