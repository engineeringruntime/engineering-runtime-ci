name: GitHub — incident what-changed

# Commits since T + merged PRs + deployments + recent main push runs.
# Manual only — supply since + environment.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository as owner/repo
        required: true
        default: ""
      since:
        description: ISO-8601 timestamp (e.g. 2026-07-24T00:00:00Z)
        required: true
      environment:
        description: Deployment environment name
        required: true
        default: production

permissions:
  contents: read

env:
  ENGINEERING_RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  RUNTIME_CONFIG_FILE: ${{ github.workspace }}/runtime-home/config.yaml
  RUNTIME_POLICY_FILE: ${{ github.workspace }}/runtime-home/policy-config.yaml
  ENGINEERING_RUNTIME_CONSUMER: ci

jobs:
  incident-forensics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime
        with:
          runtime_github_token: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          github_organization: ${{ vars.GITHUB_ORG || github.repository_owner }}

      - name: Execute github-incident-what-changed
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          set -euo pipefail
          runtime auth login github
          runtime capability validate examples/capabilities/github/github-incident-what-changed.md
          runtime --output json capability execute examples/capabilities/github/github-incident-what-changed.md \
            --input "repository=${REPOSITORY}" \
            --input "since=${{ inputs.since }}" \
            --input "environment=${{ inputs.environment }}"
          runtime auth logout github
          runtime audit tail -n 30
