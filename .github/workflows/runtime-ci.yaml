name: Runtime CI

# Smoke test: install the latest public Engineering Runtime release, bootstrap
# an empty throwaway Runtime Home, install a separate capability store, then
# exercise auth-free and GitHub operations and print the audit trail.
# See README.md for required secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Public Runtime tag to install; empty follows latest
        required: false
        default: ""

permissions:
  contents: read

env:
  ENGINEERING_RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  # Governance comes from the two documents at the root of this repository, not
  # from the binary's compiled defaults. They are the template a reader copies,
  # and CI proves them on the same commit.
  RUNTIME_CONFIG_FILE: ${{ github.workspace }}/config.yaml
  RUNTIME_POLICY_FILE: ${{ github.workspace }}/policy.yaml
  ENGINEERING_RUNTIME_CONSUMER: ci
  RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}

jobs:
  runtime-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime
        with:
          version: ${{ inputs.runtime_version || '' }}

      - name: Verify bootstrap kept Runtime Home user-owned content empty
        run: |
          set -euo pipefail
          test ! -e "${ENGINEERING_RUNTIME_HOME}/config.yaml"
          test ! -e "${ENGINEERING_RUNTIME_HOME}/policy-config.yaml"
          test ! -e "${ENGINEERING_RUNTIME_HOME}/context.yaml"
          test -d "${ENGINEERING_RUNTIME_HOME}/capabilities"
          test -z "$(find "${ENGINEERING_RUNTIME_HOME}/capabilities" -mindepth 1 -print -quit)"
          runtime capability list | grep -F "No capabilities resolved."

      - name: Setup public capability store
        id: capabilities
        uses: ./.github/actions/setup-capabilities

      - name: Validate every capability in the external store
        # Deliberately runs against the COMPILED DEFAULTS, not this repository's
        # policy.yaml. The two steps ask different questions:
        #
        #   store validation — "is every published capability valid for this
        #                       release?"  → the release's own defaults
        #   every other step — "what may this pipeline do?"  → policy.yaml
        #
        # Using the narrowed template here failed the whole job on
        # gcp-image-build-and-push, which needs `docker` — a binary this pipeline
        # deliberately omits. That is a correct refusal answering the wrong
        # question: the capability is valid for the release and simply not
        # something this pipeline may run.
        env:
          CAPABILITY_SOURCE_DIR: ${{ steps.capabilities.outputs.directory }}
          RUNTIME_POLICY_FILE: ""
          RUNTIME_CONFIG_FILE: ""
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          for f in "${CAPABILITY_SOURCE_DIR}"/**/*.md; do
            [ "$(basename "$f")" = README.md ] && continue
            echo "==> validate $f"
            runtime capability validate "$f"
          done

      - name: Auth-free capability execute (files notes-roundtrip)
        env:
          CAPABILITY_SOURCE_DIR: ${{ steps.capabilities.outputs.directory }}
        run: |
          runtime capability execute "${CAPABILITY_SOURCE_DIR}/files/notes-roundtrip.md" \
            --input path=./notes.txt \
            --input message="hello from runtime-ci"

      - name: Auth status
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: runtime auth status

      - name: Auth login github
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: runtime auth login github

      - name: Run github Runtime Commands (context-free)
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: |
          runtime github user get
          runtime github org list
          runtime github notification list

      # ---------------------------------------------------------------------
      # Transport and engine conformance.
      #
      # One real operation per transport, because two dead paths shipped in
      # v0.8.0 and every existing gate stayed green: `go build`, `go vet`,
      # `go test ./...`, a strict docs build, capability validation across the
      # whole store, and the install proof above. Validation parses; it does not
      # execute, and neither did anything else here touch the CLI transport.
      #
      # Each step names its transport so a failure is a bug report rather than
      # an exit code.
      # ---------------------------------------------------------------------

      - name: "Conformance: github REST transport"
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runtime github repo view cli/cli > /dev/null
          runtime github api GET /repos/cli/cli > /dev/null

      - name: "Conformance: github GraphQL transport"
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: runtime github repo summary cli/cli > /dev/null

      - name: "Conformance: github CLI transport (gh)"
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        # This is the row that fails against v0.8.0. The provider CLI transport
        # built an engine request with no pinned artifact, so every gh-backed
        # operation refused and 16 shipped capabilities were dead.
        run: |
          set -euo pipefail
          runtime github run list --repo cli/cli --limit 1 > /dev/null
          runtime github pr list --repo cli/cli --limit 1 > /dev/null
          runtime github workflow list --repo cli/cli > /dev/null
          runtime --output raw command run gh repo list --limit 1 \
            --json nameWithOwner | jq -e 'length == 1'

      - name: "Conformance: File Engine"
        # Write and read are the allowed control. Delete is the denial case:
        # the shipped default policy denies files delete, so a delete that
        # SUCCEEDS here means the safety floor has been lowered.
        #
        # The original version simply ran the delete and expected it to work,
        # which could never pass against the policy this product ships.
        run: |
          set -euo pipefail
          runtime files write ./conformance.txt "file engine" > /dev/null
          runtime files read ./conformance.txt | grep -qF "file engine"
          runtime files text replace --from "file engine" --to "structured file engine" \
            --file ./conformance.txt --expected-files 1 --expected-matches 1 \
            --expected-per-file 1 --dry-run | grep -qF "dry-run (nothing written)"
          runtime files read ./conformance.txt | grep -qF "file engine"
          runtime --output json files text replace \
            --from "file engine" --to "structured file engine" \
            --file ./conformance.txt --expected-files 1 --expected-matches 1 \
            --expected-per-file 1 | jq -e '.data.files[0].status == "committed"'
          runtime files read ./conformance.txt | grep -qF "structured file engine"

          if runtime files delete ./conformance.txt > /dev/null 2>&1; then
            echo "::error::files delete succeeded — the policy denial for delete is gone"
            exit 1
          fi
          echo "files delete denied, as the shipped policy requires"
          rm -f ./conformance.txt

      - name: "Conformance: Command Engine, plain binary"
        run: runtime command run git --version > /dev/null

      - name: "Conformance: safety floor still refuses a gcloud change"
        # A NEGATIVE row: it fails if the operation succeeds. A floor that
        # quietly stops refusing is worse than a transport that stops working,
        # and nothing else in this workflow would notice.
        run: |
          set -euo pipefail
          if runtime command run gcloud run deploy conformance-probe \
               --image=invalid --region=invalid-region-xyz > /dev/null 2>&1; then
            echo "SAFETY FLOOR REGRESSION: a gcloud change was permitted" >&2
            exit 1
          fi
          echo "refused, as required"

      - name: "Conformance: the same operations inside a capability"
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          CAPABILITY_SOURCE_DIR: ${{ steps.capabilities.outputs.directory }}
        # Direct invocation and a capability step do not bind identically — a
        # `binary:` step is refused until that provider's authentication is
        # enabled, while `command run` is governed by command policy instead.
        # Testing one path would miss what breaks in the other.
        run: |
          set -euo pipefail
          runtime capability execute "${CAPABILITY_SOURCE_DIR}/github/github-repo-health.md" \
            --input repository=cli/cli > /dev/null


      # --- Samples: what a reader can copy -------------------------------
      #
      # Two shapes, because they fail differently. A capability exercises the
      # grammar, input resolution and multi-step execution; a direct command
      # exercises the provider surface with nothing between it and the engine.
      # Both run under the config.yaml and policy.yaml at the root of this
      # repository, so what passes here is what the template permits.

      - name: "Sample: run a capability from the public store"
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          CAPABILITY_SOURCE_DIR: ${{ steps.capabilities.outputs.directory }}
        run: |
          set -euo pipefail
          runtime capability execute "${CAPABILITY_SOURCE_DIR}/github/repo-topics-review.md" \
            --input repository=cli/cli

      - name: "Sample: the same work as direct runtime commands"
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runtime github repo view cli/cli
          runtime github api GET /repos/cli/cli/topics
          runtime files write ./sample.txt "written under the template policy"
          runtime files read ./sample.txt
          runtime files list .

      - name: "Sample: the template's refusals, demonstrated"
        run: |
          set -euo pipefail
          # policy.yaml denies files delete. A delete that SUCCEEDS means the
          # template stopped constraining anything.
          if runtime files delete ./sample.txt > /dev/null 2>&1; then
            echo "::error::files delete succeeded — policy.yaml no longer denies it"
            exit 1
          fi
          # allowed_binaries lists three. docker is installed on the runner and
          # is deliberately not one of them.
          if runtime command run docker --version > /dev/null 2>&1; then
            echo "::error::docker ran — allowed_binaries is not narrowing anything"
            exit 1
          fi
          echo "both refusals held"
          rm -f ./sample.txt

      - name: "Sample: which governance was actually in force"
        run: runtime config validate

      - name: Auth logout github
        if: always()
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: runtime auth logout github

      - name: Show audit trail
        if: always()
        run: runtime audit tail -n 50
