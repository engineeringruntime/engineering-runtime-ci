name: Runtime CI

# Smoke test: install the latest Engineering Runtime release, bootstrap a
# throwaway Runtime Home (config/policy/context/commands come from the
# binary), validate sample capabilities, then exercise auth + a few
# context-free github commands and print the audit trail.
# See README.md for required secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  ENGINEERING_RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  RUNTIME_CONFIG_FILE: ${{ github.workspace }}/runtime-home/config.yaml
  RUNTIME_POLICY_FILE: ${{ github.workspace }}/runtime-home/policy-config.yaml
  ENGINEERING_RUNTIME_CONSUMER: ci
  RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}

jobs:
  runtime-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime
        with:
          runtime_github_token: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          github_organization: ${{ vars.GITHUB_ORG || github.repository_owner }}

      - name: Config diagnostics
        run: runtime config validate

      - name: Validate all sample capabilities
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          for f in examples/capabilities/**/*.md; do
            [ "$(basename "$f")" = README.md ] && continue
            echo "==> validate $f"
            runtime capability validate "$f"
          done

      - name: Auth-free capability execute (files notes-roundtrip)
        run: |
          runtime capability execute examples/capabilities/files/notes-roundtrip.md \
            --input path=./notes.txt \
            --input message="hello from runtime-ci"

      - name: Auth status
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: runtime auth status

      - name: Auth login github
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: runtime auth login github

      - name: Run github Runtime Commands (context-free)
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: |
          runtime github user get
          runtime github org list
          runtime github notification list

      - name: Auth logout github
        if: always()
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
        run: runtime auth logout github

      - name: Show audit trail
        if: always()
        run: runtime audit tail -n 50
