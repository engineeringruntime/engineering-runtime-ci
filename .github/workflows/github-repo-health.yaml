name: GitHub — repo health

# Runs github/github-repo-health against a repository
# (defaults to this repo). Read-only; needs RUNTIME_GITHUB_TOKEN + gh.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      repository:
        description: Repository as owner/repo
        required: true
        default: ""

permissions:
  contents: read

env:
  ENGINEERING_RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  ENGINEERING_RUNTIME_CONSUMER: ci
  RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}

jobs:
  repo-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime

      - name: Setup public capability store
        id: capabilities
        uses: ./.github/actions/setup-capabilities

      - name: Execute github-repo-health
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          CAPABILITY_PATH: ${{ steps.capabilities.outputs.directory }}/github/github-repo-health.md
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          set -euo pipefail
          runtime auth login github
          runtime capability validate "${CAPABILITY_PATH}"
          runtime --output json capability execute "${CAPABILITY_PATH}" \
            --input "repository=${REPOSITORY}"
          runtime auth logout github
          runtime audit tail -n 20
