name: GitHub — org repos + open PRs

# examples/capabilities/github/github-repositories.md — repo list for an org,
# then pr list (cwd = this checkout, so open PRs for this samples repo).

on:
  workflow_dispatch:
    inputs:
      organization:
        description: GitHub organization to list repos for
        required: true
        default: ""

permissions:
  contents: read
  pull-requests: read

env:
  ENGINEERING_RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  RUNTIME_CONFIG_FILE: ${{ github.workspace }}/runtime-home/config.yaml
  RUNTIME_POLICY_FILE: ${{ github.workspace }}/runtime-home/policy-config.yaml
  ENGINEERING_RUNTIME_CONSUMER: ci

jobs:
  repositories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime
        with:
          github_organization: ${{ inputs.organization || vars.GITHUB_ORG || github.repository_owner }}

      - name: Execute github-repositories
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          ORGANIZATION: ${{ inputs.organization || vars.GITHUB_ORG || github.repository_owner }}
        run: |
          set -euo pipefail
          runtime auth login github
          runtime capability validate examples/capabilities/github/github-repositories.md
          runtime --output json capability execute examples/capabilities/github/github-repositories.md \
            --input "organization=${ORGANIZATION}"
          runtime auth logout github
          runtime audit tail -n 20
