name: Capabilities from registry (clone)

# Company capability store path (future registry seam):
#   1. Install runtime + bootstrap runtime-home/ (binary owns executable defaults)
#   2. Clone the FULL capabilities repo (all capabilities, not one file)
#   3. Capture <clone>/capabilities plus the checked-out commit SHA
#   4. Validate every capability in that store by exact file path
#   5. Optionally execute one capability (smoke / demo)

on:
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      capabilities_repo:
        description: GitHub repo that stores ALL company capabilities (owner/name)
        required: true
        default: kishore-gutta/engineering-runtime-capabilities
      capabilities_ref:
        description: Branch, tag, or SHA to checkout
        required: true
        default: main
      execute_capability:
        description: >
          After installing the full store, optionally execute one capability
          by relative file path (e.g. files/notes-roundtrip). Leave empty to
          validate-only.
        required: false
        default: files/notes-roundtrip
      repository:
        description: Optional repository=owner/repo input for GitHub capabilities
        required: false
        default: ""

permissions:
  contents: read

env:
  ENGINEERING_RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  ENGINEERING_RUNTIME_CONSUMER: ci
  RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
  CAPABILITIES_REPO: ${{ inputs.capabilities_repo || 'kishore-gutta/engineering-runtime-capabilities' }}
  CAPABILITIES_REF: ${{ inputs.capabilities_ref || 'main' }}
  EXECUTE_CAPABILITY: ${{ inputs.execute_capability || 'files/notes-roundtrip' }}

jobs:
  install-capabilities-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI repo (for setup-runtime action)
        uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime
        with:
          github_organization: ${{ vars.GITHUB_ORG || github.repository_owner }}

      - name: Clone ALL capabilities from company store
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CAPABILITIES_REPO }}
          ref: ${{ env.CAPABILITIES_REF }}
          path: engineering-runtime-capabilities
          # Needed only when the company capability store is private.
          token: ${{ secrets.RUNTIME_GITHUB_TOKEN }}

      - name: Resolve the full capability source
        id: caps
        run: |
          set -euo pipefail
          CAP_DIR="${GITHUB_WORKSPACE}/engineering-runtime-capabilities/capabilities"
          if [ ! -d "${CAP_DIR}" ]; then
            echo "::error::Expected ${CAP_DIR} after clone — capabilities repo layout should be capabilities/{files,github}/..."
            ls -la "${GITHUB_WORKSPACE}/engineering-runtime-capabilities" || true
            exit 1
          fi

          # Persist a workflow-local path without changing Runtime's implicit
          # compatibility-cache location or its provenance label.
          echo "CAPABILITY_SOURCE_DIR=${CAP_DIR}" >> "${GITHUB_ENV}"
          revision="$(git -C "${GITHUB_WORKSPACE}/engineering-runtime-capabilities" rev-parse HEAD)"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

          count="$(find "${CAP_DIR}" -type f -name '*.md' ! -name README.md | wc -l | tr -d ' ')"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

          echo "=== Company capability store installed ==="
          echo "CAPABILITY_SOURCE_DIR=${CAP_DIR}"
          echo "Revision: ${revision}"
          echo "Capability files: ${count}"
          find "${CAP_DIR}" -type f -name '*.md' ! -name README.md | sort

      - name: Show Runtime Home vs capability store
        run: |
          set -euo pipefail
          echo "ENGINEERING_RUNTIME_HOME=${ENGINEERING_RUNTIME_HOME}  (no user-owned config, policy, or context; empty capability cache)"
          test ! -e "${ENGINEERING_RUNTIME_HOME}/config.yaml"
          test ! -e "${ENGINEERING_RUNTIME_HOME}/policy-config.yaml"
          test ! -e "${ENGINEERING_RUNTIME_HOME}/context.yaml"
          test -d "${ENGINEERING_RUNTIME_HOME}/capabilities"
          test -z "$(find "${ENGINEERING_RUNTIME_HOME}/capabilities" -mindepth 1 -print -quit)"
          echo "CAPABILITY_SOURCE_DIR=${CAPABILITY_SOURCE_DIR}  (checked-out source — NOT Home)"
          echo "CAPABILITY_SOURCE_REVISION=${{ steps.caps.outputs.revision }}"
          echo "--- runtime-home ---"
          ls -la "${ENGINEERING_RUNTIME_HOME}"
          echo "--- capabilities store (top) ---"
          ls -la "${CAPABILITY_SOURCE_DIR}"

      - name: Validate ALL capabilities in the store
        run: |
          set -euo pipefail
          # Validate each exact file from the checked-out source.
          failed=0
          checked=0
          while IFS= read -r rel; do
            path="${CAPABILITY_SOURCE_DIR}/${rel}"
            echo "==> validate ${path}"
            if ! runtime capability validate "${path}"; then
              echo "::error::validate failed: ${path}"
              failed=$((failed + 1))
            fi
            checked=$((checked + 1))
          done < <(
            cd "${CAPABILITY_SOURCE_DIR}"
            find . -type f -name '*.md' ! -name README.md | sed 's|^\./||' | sort
          )
          echo "Validated ${checked} capability(ies); failures=${failed}"
          [ "${failed}" -eq 0 ]

      - name: Execute one capability by exact path (optional smoke)
        if: env.EXECUTE_CAPABILITY != ''
        env:
          REPOSITORY: ${{ inputs.repository || github.repository }}
        run: |
          set -euo pipefail
          CAP="${EXECUTE_CAPABILITY}"
          CAP="${CAP%.md}"
          CAPABILITY_PATH="${CAPABILITY_SOURCE_DIR}/${CAP}.md"
          test -f "${CAPABILITY_PATH}"
          echo "Executing ${CAPABILITY_PATH} from revision ${{ steps.caps.outputs.revision }}"

          case "${CAP}" in
            github/*)
              runtime auth login github
              ;;
          esac

          extra=()
          case "${CAP}" in
            files/notes-roundtrip|files/notes-roundtrip.md)
              extra+=(--input path=./notes-from-registry.txt --input message="hello from company capability store")
              ;;
            github/github-repo-health|github/github-repo-health.md)
              extra+=(--input "repository=${REPOSITORY}")
              ;;
            github/github-repositories|github/github-repositories.md)
              extra+=(--input "organization=${{ vars.GITHUB_ORG || github.repository_owner }}")
              ;;
          esac

          runtime --output json capability execute "${CAPABILITY_PATH}" "${extra[@]}"

          case "${CAP}" in
            github/*)
              runtime auth logout github
              ;;
          esac

      - name: Audit trail
        if: always()
        run: runtime audit tail -n 30
