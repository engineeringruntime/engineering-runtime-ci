name: Scaffold service docs → push to repo

# Demo / CI path:
#   1. Install runtime + bootstrap runtime-home/
#   2. Clone a capability source and capture its exact commit SHA
#   3. Clone target repo (default: kishore-gutta/my-repo)
#   4. mkdir scaffold folder; run files/scaffold-service-docs by exact path
#   5. Commit README.md / CHANGELOG.md / NOTES.md and push
#
# Capability:
#   https://github.com/engineeringruntime/engineering-runtime-capabilities/blob/main/capabilities/files/scaffold-service-docs.md

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: GitHub repo to push scaffolded files into (owner/name)
        required: true
        default: kishore-gutta/my-repo
      target_ref:
        description: Branch to checkout and push to
        required: true
        default: main
      scaffold_dir:
        description: Folder inside the target repo to scaffold (created if missing)
        required: true
        default: docs/service
      service_name:
        description: Service name used in README heading
        required: true
        default: my-service
      capabilities_repo:
        description: Company capabilities store (owner/name)
        required: true
        default: engineeringruntime/engineering-runtime-capabilities
      capabilities_ref:
        description: Capabilities store ref
        required: true
        default: main

permissions:
  contents: read

env:
  ENGINEERING_RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  ENGINEERING_RUNTIME_CONSUMER: ci
  RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
  TARGET_REPO: ${{ inputs.target_repo }}
  TARGET_REF: ${{ inputs.target_ref }}
  SCAFFOLD_DIR: ${{ inputs.scaffold_dir }}
  SERVICE_NAME: ${{ inputs.service_name }}
  CAPABILITIES_REPO: ${{ inputs.capabilities_repo }}
  CAPABILITIES_REF: ${{ inputs.capabilities_ref }}

jobs:
  scaffold-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI repo (for setup-runtime action)
        uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime

      - name: Setup capability source
        id: capabilities
        uses: ./.github/actions/setup-capabilities
        with:
          repository: ${{ env.CAPABILITIES_REPO }}
          ref: ${{ env.CAPABILITIES_REF }}
          token: ${{ secrets.RUNTIME_GITHUB_TOKEN }}

      - name: Clone target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target-repo
          token: ${{ secrets.RUNTIME_GITHUB_TOKEN }}

      - name: Create scaffold folder
        run: |
          set -euo pipefail
          mkdir -p "target-repo/${SCAFFOLD_DIR}"
          echo "Scaffolding into: target-repo/${SCAFFOLD_DIR}"

      - name: Validate files/scaffold-service-docs
        env:
          CAPABILITY_PATH: ${{ steps.capabilities.outputs.directory }}/files/scaffold-service-docs.md
        run: runtime capability validate "${CAPABILITY_PATH}"

      - name: Execute files/scaffold-service-docs
        env:
          CAPABILITY_PATH: ${{ steps.capabilities.outputs.directory }}/files/scaffold-service-docs.md
        run: |
          set -euo pipefail
          DIR="${GITHUB_WORKSPACE}/target-repo/${SCAFFOLD_DIR}"
          echo "Capability source revision: ${{ steps.capabilities.outputs.revision }}"
          runtime --output json capability execute "${CAPABILITY_PATH}" \
            --input "dir=${DIR}" \
            --input "readme_content=# ${SERVICE_NAME}" \
            --input "changelog_content=## Unreleased" \
            --input "notes_content=Bootstrapped via Engineering Runtime (files/scaffold-service-docs)."
          ls -la "${DIR}"

      - name: Commit and push to target repo
        working-directory: target-repo
        run: |
          set -euo pipefail
          git config user.name "engineering-runtime-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${SCAFFOLD_DIR}/README.md" \
                  "${SCAFFOLD_DIR}/CHANGELOG.md" \
                  "${SCAFFOLD_DIR}/NOTES.md"

          if git diff --cached --quiet; then
            echo "No file changes to push (scaffold content unchanged)."
            exit 0
          fi

          git commit -m "chore: scaffold ${SCAFFOLD_DIR} via files/scaffold-service-docs

          Generated by engineering-runtime-ci workflow using capability
          files/scaffold-service-docs from ${CAPABILITIES_REPO}@${CAPABILITIES_REF}."

          # Push with RUNTIME_GITHUB_TOKEN (needs contents:write on target_repo)
          git push "https://x-access-token:${RUNTIME_GITHUB_TOKEN}@github.com/${TARGET_REPO}.git" "HEAD:${TARGET_REF}"
          echo "Pushed scaffold to https://github.com/${TARGET_REPO}/tree/${TARGET_REF}/${SCAFFOLD_DIR}"

      - name: Audit trail
        if: always()
        run: runtime audit tail -n 20
