name: GitHub — org health check

# org list + repo list + team list + issue list for a GitHub organization.
#
# These operations are org-scoped: `repo list` resolves to /orgs/{org}/repos and
# `team list` has no user-account equivalent. Seeding Runtime Context with
# `github.repository_owner` therefore 404s on a personal account, because the
# owner is a user, not an org. The resolve job below asks the runtime which orgs
# the token actually belongs to and skips the run when there are none, instead
# of failing red every Monday.

on:
  workflow_dispatch:
    inputs:
      organization:
        description: "Organization to check (defaults to vars.GITHUB_ORG, else the first org the token belongs to)"
        required: false
        type: string

permissions:
  contents: read

env:
  RUNTIME_HOME: ${{ github.workspace }}/runtime-home
  # Governance comes from the two documents at the root of this repository, not
  # from the binary's compiled defaults. They are the template a reader copies,
  # and CI proves them on the same commit.
  RUNTIME_CONFIG_FILE: ${{ github.workspace }}/config.yaml
  RUNTIME_POLICY_FILE: ${{ github.workspace }}/policy.yaml
  RUNTIME_CONSUMER: ci
  RUNTIME_ACTOR_NAME: "github-actions/${{ github.workflow }}"
  RUNTIME_SESSION_ID: "${{ github.run_id }}-${{ github.run_attempt }}"
  RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}

jobs:
  resolve:
    name: Resolve organization
    runs-on: ubuntu-latest
    outputs:
      organization: ${{ steps.pick.outputs.organization }}
      usable: ${{ steps.pick.outputs.usable }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime
        # Deliberately no github_organization — that is what we are resolving.

      - name: Ask the runtime which orgs this token belongs to
        id: pick
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.organization }}
          CONFIGURED: ${{ vars.GITHUB_ORG }}
        run: |
          set -euo pipefail
          runtime auth login github

          # Discovery goes through the runtime, never a bare gh/curl call.
          orgs_json="$(runtime --output json github org list)"
          echo "$orgs_json" | jq -r '"orgs visible to this token: \(.output | length)"'

          org=""
          if [ -n "${REQUESTED:-}" ]; then
            org="$REQUESTED"
            echo "using organization from workflow input: $org"
          elif [ -n "${CONFIGURED:-}" ]; then
            org="$CONFIGURED"
            echo "using organization from vars.GITHUB_ORG: $org"
          else
            org="$(echo "$orgs_json" | jq -r '.output[0].login // empty')"
            [ -n "$org" ] && echo "using first org the token belongs to: $org"
          fi

          runtime auth logout github

          if [ -z "$org" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped::This token belongs to no GitHub organization, and neither vars.GITHUB_ORG nor the workflow input is set. org list / team list are org-scoped, so there is nothing to check. Set repository variable GITHUB_ORG to enable this workflow."
          else
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "organization=$org" >> "$GITHUB_OUTPUT"
          fi

  org-health:
    name: Org health check
    needs: resolve
    if: needs.resolve.outputs.usable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Engineering Runtime
        uses: ./.github/actions/setup-runtime
        with:
          github_organization: ${{ needs.resolve.outputs.organization }}

      - name: Setup public capability store
        id: capabilities
        uses: ./.github/actions/setup-capabilities

      - name: Execute github-org-health-check
        env:
          RUNTIME_GITHUB_TOKEN: ${{ secrets.RUNTIME_GITHUB_TOKEN }}
          CAPABILITY_PATH: ${{ steps.capabilities.outputs.directory }}/github/github-org-health-check.md
        run: |
          set -euo pipefail
          runtime auth login github
          runtime capability validate "${CAPABILITY_PATH}"
          runtime --output json capability execute "${CAPABILITY_PATH}" \
            --input "organization=${RUNTIME_GITHUB_ORG}"
          runtime auth logout github
          runtime audit tail -n 20
