# Sample policy — copy to ~/.engineering-runtime/policy-config.yaml.
# Update this file whenever a new Runtime Command or binary is introduced
# (internal/policy/policy.go). Absent policy file => everything is denied
# (fail-safe, not fail-open).
enabled: true

# Governs `runtime github ...` / `runtime files ...` (the fixed Runtime
# Command registry compiled into the binary — internal/commands).
allowed_commands:
  - github.repositories.list
  - github.repositories.list_for_org
  - github.repositories.create
  - github.issues.list_for_org
  - github.teams.list
  - github.organizations.list
  - github.notifications.list
  - github.user.get
  - github.request
  - files.read
  - files.write
  - files.append
  - files.delete
  - files.list

# Governs `runtime command run <binary>` — no command registration needed.
allowed_binaries:
  - gh
  - terraform
  - gcloud
  - kubectl
  - oc

command_policy:
  denied_binaries:
    - rm
    - sudo
    - chmod
    - curl
    - wget
    - ssh
  rules:
    terraform:
      denied:
        - destroy
    gcloud:
      denied:
        - projects delete
        - iam service-accounts delete
    kubectl:
      denied:
        - delete namespace
    oc:
      denied:
        - delete project
